    environment: &customer-env
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://customer-service:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${CUSTOMER_DB:-customer_db}
      DB_USERNAME: ${POSTGRES_USER:-eproperty}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deployment}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-please-change-1234567890}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-eproperty}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eproperty-dev-pass}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5

  customer-outbox:
    build: ./services/customer-service
    environment: *customer-env
    command: php artisan outbox:publish --watch
    depends_on:
      customer-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  supplier-service:
    build: ./services/supplier-service
    environment: &supplier-env
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://supplier-service:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${SUPPLIER_DB:-supplier_db}
      DB_USERNAME: ${POSTGRES_USER:-eproperty}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deployment}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-please-change-1234567890}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-eproperty}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eproperty-dev-pass}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
