    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5

  supplier-outbox:
    build: ./services/supplier-service
    environment: *supplier-env
    command: php artisan outbox:publish --watch
    depends_on:
      supplier-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  meter-reading-service:
    build: ./services/meter-reading-service
    environment: &meter-env
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://meter-reading-service:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${METER_READING_DB:-meter_reading_db}
      DB_USERNAME: ${POSTGRES_USER:-eproperty}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deployment}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-please-change-1234567890}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
    volumes:
      - meter-photos:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5

  realtime-gateway:
    build: ./services/realtime-gateway
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-eproperty}:${RABBITMQ_PASSWORD:-eproperty-dev-pass}@rabbitmq:5672/%2F
      EVENT_EXCHANGE: ${EVENT_EXCHANGE:-eproperty.events}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-please-change-1234567890}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/gateway/html:/usr/share/nginx/html:ro
    depends_on:
      identity-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      contractor-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      meter-reading-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy

volumes:
  postgres-data:
  meter-photos:
