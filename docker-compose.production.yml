      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CONTRACTOR_APP_KEY}
      APP_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${CONTRACTOR_DB:-contractor_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  contractor-outbox:
    build: ./services/contractor-service
    restart: unless-stopped
    environment: *contractor-env
    command: php artisan outbox:publish --watch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  customer-service:
    build: ./services/customer-service
    restart: unless-stopped
    environment: &customer-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CUSTOMER_APP_KEY}
      APP_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${CUSTOMER_DB:-customer_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  customer-outbox:
    build: ./services/customer-service
    restart: unless-stopped
    environment: *customer-env
    command: php artisan outbox:publish --watch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  supplier-service:
    build: ./services/supplier-service
    restart: unless-stopped
    environment: &supplier-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${SUPPLIER_APP_KEY}
      APP_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${SUPPLIER_DB:-supplier_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  supplier-outbox:
    build: ./services/supplier-service
    restart: unless-stopped
    environment: *supplier-env
    command: php artisan outbox:publish --watch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  realtime-gateway:
    build: ./services/realtime-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      EVENT_EXCHANGE: ${EVENT_EXCHANGE:-eproperty.events}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/gateway/html:/usr/share/nginx/html:ro
    depends_on:
      identity-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      contractor-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
    networks: [private, edge]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    networks: [edge]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
