services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      identity-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      contractor-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      meter-reading-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_started
    networks:
      - eproperty-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    networks:
      - eproperty-network
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=identity-db
      - DB_DATABASE=identity_db
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  customer-service:
    build: ./services/customer-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=customer-db
      - DB_DATABASE=customer_db
    depends_on:
      customer-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  employee-service:
    build: ./services/employee-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=employee-db
      - DB_DATABASE=employee_db
    depends_on:
      employee-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  contractor-service:
    build: ./services/contractor-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=contractor-db
      - DB_DATABASE=contractor_db
    depends_on:
      contractor-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  supplier-service:
    build: ./services/supplier-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=supplier-db
      - DB_DATABASE=supplier_db
    depends_on:
      supplier-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meter-reading-service:
    build: ./services/meter-reading-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=meter-db
      - DB_DATABASE=meter_reading_db
    depends_on:
      meter-db:
        condition: service_healthy
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  realtime-gateway:
    build: ./services/realtime-gateway
    environment:
      - NODE_ENV=production
    networks:
      - eproperty-network
    restart: unless-stopped

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - customer-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  employee-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - employee-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  contractor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contractor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - contractor-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  supplier-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supplier-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meter-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meter_reading_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - meter-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - eproperty-network
    restart: unless-stopped

volumes:
  identity-data:
  customer-data:
  employee-data:
  contractor-data:
  supplier-data:
  meter-data:
  redis-data:

networks:
  eproperty-network:
    driver: bridge
