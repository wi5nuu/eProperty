version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - identity-service
      - customer-service
      - employee-service
      - contractor-service
      - supplier-service
      - meter-reading-service
      - realtime-gateway
      - web
    networks:
      - eproperty-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    networks:
      - eproperty-network
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - identity-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  customer-service:
    build: ./services/customer-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - customer-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  employee-service:
    build: ./services/employee-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - employee-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  contractor-service:
    build: ./services/contractor-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - contractor-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  supplier-service:
    build: ./services/supplier-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - supplier-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  meter-reading-service:
    build: ./services/meter-reading-service
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - meter-db
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  realtime-gateway:
    build: ./services/realtime-gateway
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - eproperty-network
    restart: unless-stopped

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - customer-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  employee-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - employee-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  contractor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contractor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - contractor-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  supplier-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supplier-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  meter-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - meter-data:/var/lib/postgresql/data
    networks:
      - eproperty-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - eproperty-network
    restart: unless-stopped

volumes:
  identity-data:
  customer-data:
  employee-data:
  contractor-data:
  supplier-data:
  meter-data:
  redis-data:

networks:
  eproperty-network:
    driver: bridge
