services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB: ${IDENTITY_DB:-identity_db}
      EMPLOYEE_DB: ${EMPLOYEE_DB:-employee_db}
      CONTRACTOR_DB: ${CONTRACTOR_DB:-contractor_db}
      CUSTOMER_DB: ${CUSTOMER_DB:-customer_db}
      SUPPLIER_DB: ${SUPPLIER_DB:-supplier_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  identity-service:
    build: ./services/identity-service
    restart: unless-stopped
    environment: &identity-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${IDENTITY_APP_KEY}
      APP_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${IDENTITY_DB:-identity_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  identity-outbox:
    build: ./services/identity-service
    restart: unless-stopped
    environment: *identity-env
    command: php artisan outbox:publish --watch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  employee-service:
    build: ./services/employee-service
    restart: unless-stopped
    environment: &employee-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${EMPLOYEE_APP_KEY}
      APP_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${EMPLOYEE_DB:-employee_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: eproperty-identity
      JWT_AUDIENCE: eproperty-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) !@file_get_contents('http://127.0.0.1:8000/up'));\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  employee-outbox:
    build: ./services/employee-service
    restart: unless-stopped
    environment: *employee-env
    command: php artisan outbox:publish --watch
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  contractor-service:
