events {}

http {
    upstream identity_upstream {
        server identity-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream employee_upstream {
        server employee-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream contractor_upstream {
        server contractor-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream customer_upstream {
        server customer-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream supplier_upstream {
        server supplier-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream realtime_upstream {
        server realtime-gateway:3000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream meter_upstream {
        server meter-reading-service:8000 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;
        root /usr/share/nginx/html;
        index index.html;

        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 1;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = / {
            try_files /index.html =404;
        }

        location = /api/v1/identity {
            default_type application/json;
            return 404 '{"message":"Not found"}';
        }

        location ^~ /api/v1/identity/ {
            rewrite ^/api/v1/identity/(.*)$ /api/$1 break;
            proxy_pass http://identity_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/employees/health {
            proxy_pass http://employee_upstream/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/employees {
            proxy_pass http://employee_upstream/api/employees;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/employees/ {
            rewrite ^/api/v1/employees/(.*)$ /api/employees/$1 break;
            proxy_pass http://employee_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/contractors/health {
            proxy_pass http://contractor_upstream/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/contractors {
            proxy_pass http://contractor_upstream/api/contractors;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/contractors/ {
            rewrite ^/api/v1/contractors/(.*)$ /api/contractors/$1 break;
            proxy_pass http://contractor_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/customers/health {
            proxy_pass http://customer_upstream/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/customers {
            proxy_pass http://customer_upstream/api/customers;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/customers/ {
            rewrite ^/api/v1/customers/(.*)$ /api/customers/$1 break;
            proxy_pass http://customer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/suppliers/health {
            proxy_pass http://supplier_upstream/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/suppliers {
            proxy_pass http://supplier_upstream/api/suppliers;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/suppliers/ {
            rewrite ^/api/v1/suppliers/(.*)$ /api/suppliers/$1 break;
            proxy_pass http://supplier_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/meter/dashboard {
            proxy_pass http://meter_upstream/api/dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/meter/houses/map {
            proxy_pass http://meter_upstream/api/houses/map;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/meter/houses {
            proxy_pass http://meter_upstream/api/houses;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/meter/houses/ {
            rewrite ^/api/v1/meter/houses/(.*)$ /api/houses/$1 break;
            proxy_pass http://meter_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/meter/readings {
            proxy_pass http://meter_upstream/api/readings;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/meter/readings/ {
            rewrite ^/api/v1/meter/readings/(.*)$ /api/readings/$1 break;
            proxy_pass http://meter_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /ws {
            proxy_pass http://realtime_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
