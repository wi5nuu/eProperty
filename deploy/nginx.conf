events {
    worker_connections 1024;
}

http {
    upstream identity-service {
        server identity-service:8001;
    }

    upstream customer-service {
        server customer-service:8002;
    }

    upstream employee-service {
        server employee-service:8003;
    }

    upstream contractor-service {
        server contractor-service:8004;
    }

    upstream supplier-service {
        server supplier-service:8005;
    }

    upstream meter-reading-service {
        server meter-reading-service:8006;
    }

    upstream realtime-gateway {
        server realtime-gateway:8080;
    }

    upstream frontend {
        server web:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/v1/identity/ {
            proxy_pass http://identity-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/customer/ {
            proxy_pass http://customer-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/employee/ {
            proxy_pass http://employee-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/contractor/ {
            proxy_pass http://contractor-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/supplier/ {
            proxy_pass http://supplier-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/meter-reading/ {
            proxy_pass http://meter-reading-service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://realtime-gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
